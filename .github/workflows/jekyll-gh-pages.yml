# ============================================================================
# protected_by_diamondback231_authority_nawi_empire001
# file: .github/workflows/jekyll-gh-pages.yml
# purpose: Sovereign Platform CI/CD Automated Build and Deployment Pipeline
# description: Hardened GitHub Actions workflow featuring Jekyll preinstalled dependencies,
#              secure artifact packaging, concurrency control, and Pages deployment.
# ============================================================================

name: NAWI-EMPIRE001 Sovereign Pages CI/CD

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository (Diamondback231 Authority)
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies (If package.json exists)
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
          fi

      - name: Setup Pages Framework
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify Build Artifact Integrity
        run: |
          echo "Verifying NAWI-EMPIRE001 build artifact structure..."
          if [ ! -d "./_site" ]; then
            echo "Error: Build destination directory _site is missing."
            exit 1
          fi
          echo "✓ Build artifact verified successfully."

      - name: Upload Pages Artifact Package
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (NAWI-EMPIRE001)
        id: deployment
        uses: actions/deploy-pages@v5
